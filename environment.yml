# SMPS Reproducible Environment
# Generated: 2026-02-06
# Updated: 2026-02-06 - Fixed version mismatches
# This environment ensures complete reproducibility of SMPS results

name: smps
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.9.18

  # Scientific computing
  - numpy=2.4.1
  - pandas=3.0.0
  - scipy=1.16.3
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - seaborn=0.12.2

  # Machine Learning
  - lightgbm=4.6.0
  - optuna=4.7.0
  - mlflow=3.8.1

  # Data processing
  - geopandas=0.13.2
  - xarray=2023.7.0
  - netcdf4=1.6.4
  - earthengine-api=0.1.374

  # Development tools
  - pytest=9.0.2
  - pytest-cov=7.0.0
  - black=23.7.0
  - isort=5.12.0
  - mypy=1.5.1
  - ruff=0.0.285
  - pre-commit=3.4.0

  # Reproducibility tools
  - dvc=3.16.1
  - dvc-gdrive=2.20.0
  - gitpython=3.1.32

  # System utilities
  - joblib=1.5.3
  - psutil=7.2.2
  - pyyaml=6.0.3
  - tqdm=4.67.1
  - requests=2.32.5
  - python-dateutil=2.9.0.post0

  # Pydantic ecosystem
  - pydantic=2.12.5
  - pydantic-settings=2.12.0

  # Sensitivity analysis
  - pip:
    - SALib==1.4.7

  # Pip-only packages
  - pip:
    - setuptools>=61.0
    - wheel